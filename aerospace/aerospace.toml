# AeroSpace config. Reference: https://nikitabobko.github.io/AeroSpace/guide
#
# Modifier: ctrl-alt (intended as a single Voyager thumb hold), so every
# binding is thumb + right-hand key and never chords two home-row mods.
# Plain alt is left alone so readline's alt-b/f/d/u/l/c keep working.
# Focus/move use IJKL to mirror the arrow layer (I up, J left, K down, L right).

config-version = 2

after-startup-command = []
start-at-login = true
auto-reload-config = true

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 60
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
automatically-unhide-macos-hidden-apps = false

# Suggested roles: 1 terminal, 2 browser, 3 chat, 4 notes, 5 everything else.
persistent-workspaces = ["1", "2", "3", "4", "5"]

on-mode-changed = []
focus-follows-mouse.enabled = false
key-mapping.preset = 'qwerty'

gaps.inner.horizontal = 0
gaps.inner.vertical =   0
# The DELL values are managed by ~/.config/aerospace/smart-gaps.sh: a per-app
# gap centres a lone tiled window on the visible workspace, 0 otherwise.
# Edit lone_window_gap there.
gaps.outer.left =       [{ monitor."DELL" = 0 }, 0]
gaps.outer.bottom =     0
gaps.outer.top =        0
gaps.outer.right =      [{ monitor."DELL" = 0 }, 0]

on-focus-changed = ['exec-and-forget /Users/pavel/.config/aerospace/smart-gaps.sh']
exec-on-workspace-change = ['/bin/bash', '-c', '/Users/pavel/.config/aerospace/smart-gaps.sh']

[mode.main.binding]
    # focus / move: IJKL like the arrow layer
    ctrl-alt-i = 'focus up'
    ctrl-alt-j = 'focus left'
    ctrl-alt-k = 'focus down'
    ctrl-alt-l = 'focus right'
    ctrl-alt-shift-i = 'move up'
    ctrl-alt-shift-j = 'move left'
    ctrl-alt-shift-k = 'move down'
    ctrl-alt-shift-l = 'move right'

    ctrl-alt-slash = 'layout tiles horizontal vertical'      # side-by-side, toggle split direction
    ctrl-alt-comma = ['layout h_accordion h_tiles',          # toggle side-by-side stack <-> columns
                      'exec-and-forget /Users/pavel/.config/aerospace/smart-gaps.sh']
    ctrl-alt-f     = 'fullscreen'                            # temporary zoom on one window
    ctrl-alt-u     = 'resize smart -100'   # shrink (U/O flank the IJKL cluster)
    ctrl-alt-o     = 'resize smart +100'   # grow
    ctrl-alt-minus = 'resize smart -100'
    ctrl-alt-equal = 'resize smart +100'

    ctrl-alt-1 = 'workspace 1'
    ctrl-alt-2 = 'workspace 2'
    ctrl-alt-3 = 'workspace 3'
    ctrl-alt-4 = 'workspace 4'
    ctrl-alt-5 = 'workspace 5'
    ctrl-alt-shift-1 = 'move-node-to-workspace --focus-follows-window 1'
    ctrl-alt-shift-2 = 'move-node-to-workspace --focus-follows-window 2'
    ctrl-alt-shift-3 = 'move-node-to-workspace --focus-follows-window 3'
    ctrl-alt-shift-4 = 'move-node-to-workspace --focus-follows-window 4'
    ctrl-alt-shift-5 = 'move-node-to-workspace --focus-follows-window 5'
    ctrl-alt-tab = 'workspace-back-and-forth'
    ctrl-alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

    ctrl-alt-semicolon = 'mode service'

    # App launcher: focus the app (launching it if needed). AeroSpace follows
    # the focus to whichever workspace holds the app's window.
    alt-1 = 'exec-and-forget open -b company.thebrowser.dia'
    alt-2 = 'exec-and-forget open -b com.anthropic.claudefordesktop'
    alt-3 = 'exec-and-forget open -b com.googlecode.iterm2'
    alt-4 = 'exec-and-forget open -b com.tinyspeck.slackmacgap'
    alt-5 = 'exec-and-forget open -b md.obsidian'

# Service mode: one key, then back to main mode.
[mode.service.binding]
    esc = ['reload-config', 'mode main']
    r = ['flatten-workspace-tree', 'mode main']   # reset a messy layout
    b = ['balance-sizes', 'mode main']            # equalise window sizes
    f = ['layout floating tiling', 'mode main',   # float/unfloat focused window
         'exec-and-forget /Users/pavel/.config/aerospace/smart-gaps.sh']
    # Join with neighbour. The ctrl-alt variants work while still holding the
    # thumb modifier used to enter this mode.
    i = ['join-with up', 'mode main']
    j = ['join-with left', 'mode main']
    k = ['join-with down', 'mode main']
    l = ['join-with right', 'mode main']
    ctrl-alt-i = ['join-with up', 'mode main']
    ctrl-alt-j = ['join-with left', 'mode main']
    ctrl-alt-k = ['join-with down', 'mode main']
    ctrl-alt-l = ['join-with right', 'mode main']

# AeroSpace mistakes Dia's main windows for dialogs and floats them; force tiling.
[[on-window-detected]]
    if.app-id = 'company.thebrowser.dia'
    check-further-callbacks = true
    run = 'layout tiling'

# 1Password always floats (main window and Quick Access).
[[on-window-detected]]
    if.app-id = 'com.1password.1password'
    check-further-callbacks = true
    run = 'layout floating'

# Granola always floats.
[[on-window-detected]]
    if.app-id = 'com.granola.app'
    check-further-callbacks = true
    run = 'layout floating'

# Shottr always floats (editor and pinned screenshots).
[[on-window-detected]]
    if.app-id = 'cc.ffitch.shottr'
    check-further-callbacks = true
    run = 'layout floating'

# Re-evaluate the Dell's lone-window gaps when a window appears.
[[on-window-detected]]
    check-further-callbacks = true
    run = 'exec-and-forget /Users/pavel/.config/aerospace/smart-gaps.sh'
